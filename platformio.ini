; ESP32 Lab - PlatformIO configuration for the esp32dev module
; Each [env:...] builds only one experiment folder from src/

[platformio]
default_envs = blink

; Shared settings for every experiment
[env]
platform = espressif32
board = esp32dev
framework = arduino

; Serial
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Flashing (lower to 460800 or 115200 if uploads fail)
upload_speed = 921600

; Build
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wall

; Experiments
[env:blink]
build_src_filter = -<*> +<01_blink/>

[env:wifi_scan]
build_src_filter = -<*> +<02_wifi_scan/>

; Template for new experiments: copy, rename, point at the new folder
; [env:my_experiment]
; build_src_filter = -<*> +<03_my_experiment/>
; lib_deps =
;     adafruit/Adafruit BME280 Library
